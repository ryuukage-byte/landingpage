<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple Form — Sevnsoul</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="sevnsoul-theme.css">
</head>
<body>
<div class="wrap">
  <header class="site-header">
    <a class="back-link" href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      <span>Home</span>
    </a>
    <a class="brand" href="index.html">
      <img class="brand-mark" src="favicon-transparent.png" alt="Sevnsoul">
      <span class="brand-name">SEVNSOUL</span>
    </a>
    <span class="header-code">SVN / FORM</span>
  </header>

  <main class="form-page">
    <section class="form-shell">
      <div class="eyebrow">SEVNSOUL / INPUT</div>
      <h1>Isi Data Anda</h1>
      <p class="intro">Silakan lengkapi formulir di bawah ini dengan informasi yang sesuai.</p>

      <form action="#" method="POST">
        <div class="form-group">
          <label for="name">NAMA LENGKAP</label>
          <input type="text" id="name" name="name" placeholder="Masukkan nama Anda" required>
        </div>
        <div class="form-group">
          <label for="email">ALAMAT EMAIL</label>
          <input type="email" id="email" name="email" placeholder="nama@email.com" required>
        </div>
        <div class="form-group">
          <label for="message">PESAN (OPSIONAL)</label>
          <textarea id="message" name="message" placeholder="Tuliskan pesan Anda di sini..."></textarea>
        </div>
        <button class="submit-btn" type="submit">Kirim Sekarang</button>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-brand">
      <img class="footer-mark" src="favicon-transparent.png" alt="">
      <span>SEVNSOUL · <span id="year"></span></span>
    </div>
    <span>Ideas, Built.</span>
  </footer>
</div>
<script>
document.getElementById('year').textContent = new Date().getFullYear();
</script>
</body>
</html>
