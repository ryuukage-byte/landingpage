<!doctype html>
<html lang="id" data-motion="full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-visual">
<meta name="theme-color" content="#080808">
<title>Sevnsoul — Ideas, Built</title>
<meta name="description" content="Sevnsoul — temukan SevnQuest, layanan video, dan cara berkolaborasi.">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="brand-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Only the weights in use; loaded without blocking first paint (fallback fonts until it arrives). -->
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500&family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500&family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap"></noscript>
<style>
  /* Tokens follow sevnsoul-theme.css (ryuukage-byte/landingpage). */
  :root {
    color-scheme: dark;
    --bg: #080808; --bg-soft: #0b0b0b; --surface: #111111; --surface-2: #171717; --surface-3: #1e1e1e;
    --text: #f4f4f2; --text-dim: rgba(244, 244, 242, .58); --text-faint: rgba(244, 244, 242, .34);
    --border: rgba(255, 255, 255, .075); --border-strong: rgba(255, 255, 255, .145); --border-focus: rgba(255, 255, 255, .28);
    --glass: rgba(14, 14, 14, .88); /* opaque enough to read without a backdrop blur */
    --font-display: 'Space Grotesk', system-ui, sans-serif;
    --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, monospace;
    --radius: 20px; --r-m: 12px;
    --dur-1: 250ms; --dur-2: 300ms; --dur-3: 500ms;
    --ease: cubic-bezier(.22, 1, .36, 1);
  }
  [data-motion="reduced"] { --dur-1: 0ms; --dur-2: 0ms; --dur-3: 0ms; }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; color: var(--text); }
  body { font: 400 15px/1.6 var(--font-sans); overflow: hidden; overscroll-behavior: none; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
    background:
      radial-gradient(ellipse 900px 620px at 50% -12%, rgba(255, 255, 255, .045), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 82%, rgba(255, 255, 255, .018), transparent 62%),
      var(--bg); }
  /* Scanlines: plain alpha (no blend mode), so the compositor never re-blends it over the canvas. Off on phones. */
  body::before { content: ''; position: fixed; inset: 0; z-index: 5; pointer-events: none; opacity: .11;
    background-image: repeating-linear-gradient(0deg, rgba(255, 255, 255, .016) 0 1px, transparent 1px 3px); }
  ::selection { background: var(--text); color: var(--bg); }
  a { color: inherit; text-decoration: none; }
  svg { display: block; flex: none; }
  :focus-visible { outline: 1px solid var(--border-focus); outline-offset: 3px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  .scene { position: fixed; inset: 0; overflow: hidden; }
  #room { position: absolute; left: 0; top: 0; image-rendering: pixelated; image-rendering: crisp-edges;
    opacity: 0; transition: opacity 900ms var(--ease); }
  .scene.is-lit #room { opacity: 1; }
  [data-motion="reduced"] #room { transition: none; }

  /* Every overlay is positioned in px by landing.js from the mascot's pixel coords. */
  .float { position: absolute; left: 0; top: 0; }
  #banner { will-change: transform; } /* the only overlay that moves every frame */
  button, a, input { touch-action: manipulation; }
  .scene { transition: transform var(--dur-2) var(--ease); }

  /* Header and footer: quiet mono meta, fade in with the search field */
  .chrome { position: absolute; left: 0; right: 0; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    padding: 0 24px; font: 400 9px/1 var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--text-faint);
    opacity: 0; transition: opacity var(--dur-3) var(--ease); z-index: 2; }
  .scene.is-ready .chrome { opacity: 1; }
  .chrome--top { top: max(24px, env(safe-area-inset-top)); }
  .chrome--bottom { bottom: max(20px, env(safe-area-inset-bottom)); }
  .chrome > :last-child { justify-self: end; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand img { width: 26px; height: 26px; object-fit: contain; filter: drop-shadow(0 4px 12px rgba(255, 255, 255, .05)); }
  .brand span { font: 500 10px/1 var(--font-mono); letter-spacing: .35em; padding-left: .35em; color: rgba(244, 244, 242, .62); }
  .tools { display: flex; gap: 6px; }
  .tools a, .tools button { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; cursor: pointer;
    border: 1px solid var(--border); background: rgba(255, 255, 255, .02); color: var(--text-dim);
    transition: color var(--dur-1) ease, border-color var(--dur-1) ease; }
  @media (pointer: coarse) { .tools a, .tools button { width: 44px; height: 44px; } }
  .tools a:hover, .tools button:hover { color: var(--text); border-color: var(--border-strong); }
  @media (max-width: 760px) {
    body::before { display: none; }
    .chrome { padding: 0 18px; }
    .chrome--top { grid-template-columns: auto 1fr; }
    .chrome--top .code { display: none; }
    .brand span { display: none; }
  }

  /* Speech bubble */
  #say { max-width: min(300px, calc(100vw - 32px)); padding: 11px 16px; text-align: center;
    font: 400 15px/1.5 var(--font-display); letter-spacing: -.01em;
    background: linear-gradient(145deg, #161616, #0f0f0f); border: 1px solid var(--border-strong); border-radius: 16px;
    box-shadow: 0 18px 40px rgba(0, 0, 0, .35), inset 0 1px 0 rgba(255, 255, 255, .03);
    opacity: 0; translate: 0 4px; transition: opacity var(--dur-2) var(--ease), translate var(--dur-2) var(--ease); pointer-events: none; }
  #say::after { content: ''; position: absolute; left: var(--tail, 50%); top: 100%; width: 10px; height: 10px; margin: -5px 0 0 -5px;
    background: #0f0f0f; border: solid var(--border-strong); border-width: 0 1px 1px 0; rotate: 45deg; }
  #say.is-in { opacity: 1; translate: 0 0; }
  .caret { display: inline-block; width: 1px; height: 1.05em; margin-left: 2px; background: var(--text-dim); vertical-align: -2px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* Suggestion bubbles orbiting the mascot */
  .bubble { font: 500 10.5px/1.3 var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--text-dim);
    background: var(--glass); border: 1px solid var(--border-strong); border-radius: 999px;
    min-height: 44px; padding: 6px 16px 6px 8px; display: inline-flex; align-items: center; gap: 10px;
    cursor: pointer; white-space: nowrap; text-align: left;
    opacity: 0; translate: 0 8px; transition: opacity var(--dur-2) var(--ease), translate var(--dur-3) var(--ease), color var(--dur-1) ease, border-color var(--dur-1) ease; }
  .bubble.is-in { opacity: 1; translate: 0 0; }
  .bubble:hover { color: var(--text); border-color: rgba(255, 255, 255, .3); }
  /* Gliding between the orbit and the dock under the search field */
  .bubble.glide { transition: transform var(--dur-3) var(--ease), opacity var(--dur-2) var(--ease), color var(--dur-1) ease, border-color var(--dur-1) ease; }
  .bubble.is-current { color: var(--text); border-color: var(--border-focus); background: rgba(30, 30, 30, .8); }
  .bubble .ico { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--border); background: #0c0c0c; color: var(--text); }
  @media (max-width: 560px) {
    .bubble { gap: 6px; padding: 6px 14px 6px 10px; letter-spacing: .06em; }
    .bubble .ico { width: 24px; height: 24px; border: 0; background: none; }
  }

  /* Search */
  #searchForm { width: min(440px, calc(100vw - 36px)); opacity: 0; translate: 0 14px; pointer-events: none;
    transition: opacity var(--dur-3) var(--ease), translate var(--dur-3) var(--ease); }
  #searchForm.is-in { opacity: 1; translate: 0 0; pointer-events: auto; }
  .field { display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 7px 0 16px;
    background: rgba(10, 10, 10, .8); border: 1px solid var(--border); border-radius: 999px;
    transition: border-color var(--dur-1) ease, background var(--dur-1) ease, box-shadow var(--dur-1) ease; }
  .field:hover { border-color: var(--border-strong); }
  .field:focus-within { border-color: var(--border-focus); background: #0d0d0d; box-shadow: 0 0 0 4px rgba(255, 255, 255, .025); }
  .field > [data-icon] { color: var(--text-faint); }
  .field input { flex: 1; min-width: 0; background: none; border: 0; color: var(--text); font: 400 16px var(--font-sans); padding: 14px 0; }
  .field input:focus { outline: none; }
  .field input::placeholder { color: var(--text-faint); }
  .field input::-webkit-search-cancel-button { display: none; }
  .field button { width: 38px; height: 38px; border: 0; border-radius: 50%; display: grid; place-items: center; cursor: pointer;
    background: var(--text); color: var(--bg); transition: transform var(--dur-1) var(--ease), opacity var(--dur-1) ease; }
  .field button:hover { transform: translateX(2px); opacity: .92; }

  /* The banner lives above the ceiling until it is pulled down: clip everything above the ceiling line. */
  .hang { position: absolute; inset: 0; clip-path: inset(var(--ceil, 0px) 0 0 0); pointer-events: none; }
  .hang > * { pointer-events: auto; }

  /* Pull cord: drops out of the ceiling where the hidden banner hangs */
  .cord { width: 8px; height: 0; transition: height 420ms var(--ease); }
  .cord::before { content: ''; position: absolute; left: 3px; top: 0; bottom: 6px; width: 1px; background: linear-gradient(rgba(255, 255, 255, .2), rgba(255, 255, 255, .55)); }
  .cord::after { content: ''; position: absolute; left: 0; bottom: 0; width: 7px; height: 7px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, .6); background: #111;
    opacity: 0; transition: opacity 200ms ease; }
  .cord.is-down { height: 44px; }
  .cord.is-down::after { opacity: 1; transition-delay: 220ms; }
  [data-motion="reduced"] .cord { display: none; }

  /* Banner: a product card hanging on two threads from the ceiling */
  #banner { width: min(340px, calc(100vw - 36px)); padding: 14px; display: grid; gap: 0; border-radius: var(--radius);
    border: 1px solid var(--border-strong); overflow: visible;
    background: radial-gradient(circle 300px at 50% 0, rgba(255, 255, 255, .05), transparent 65%), linear-gradient(145deg, #141414, #0e0e0e);
    box-shadow: 0 18px 40px rgba(0, 0, 0, .35), inset 0 1px 0 rgba(255, 255, 255, .025);
    transition: padding var(--dur-2) var(--ease); }
  #banner:not(.is-compact) { padding: 22px; }
  #banner[hidden] { display: none; }
  #banner.is-moving { transition: transform var(--dur-3) var(--ease), padding var(--dur-2) var(--ease); }
  #banner::before, #banner::after { content: ''; position: absolute; bottom: 100%; width: 1px; height: 100vh; background: linear-gradient(transparent, rgba(255, 255, 255, .24)); }
  #banner::before { left: 32px; } #banner::after { right: 32px; }
  .banner-head { display: flex; align-items: center; gap: 14px; }
  .banner-icon { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; flex: none;
    background: linear-gradient(145deg, #1d1d1d, #0b0b0b); border: 1px solid var(--border-strong);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .045), 0 10px 22px rgba(0, 0, 0, .22); }
  .banner-head h2 { margin: 0; flex: 1; font: 500 21px/1.1 var(--font-display); letter-spacing: -.03em; }
  .badge { padding: 7px 9px; border: 1px solid var(--border); border-radius: 999px; background: rgba(255, 255, 255, .025);
    font: 400 8px/1 var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--text-dim); white-space: nowrap; }
  .badge::before { content: ''; display: inline-block; width: 5px; height: 5px; margin-right: 7px; border-radius: 50%; background: var(--text); box-shadow: 0 0 0 2px rgba(255, 255, 255, .08); vertical-align: 1px; }
  .badge[hidden], #banner.is-compact .badge { display: none; }
  .banner-more { display: grid; gap: 18px; margin-top: 16px; animation: rise var(--dur-3) var(--ease) both; }
  #banner.is-compact .banner-more { display: none; }
  .banner-more p { margin: 0; color: var(--text-dim); font-size: 13.5px; line-height: 1.65; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
  .btn { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 46px; padding: 0 18px; border-radius: var(--r-m);
    background: var(--text); color: #090909; font: 600 14px var(--font-sans); transition: transform var(--dur-1) var(--ease), opacity var(--dur-1) ease; }
  .btn:hover { transform: translateY(-2px); opacity: .93; }
  .alts { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding-top: 14px; border-top: 1px solid var(--border);
    font: 400 9px/1 var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--text-faint); }
  .alts:empty { display: none; }
  .alts button { font: inherit; letter-spacing: inherit; text-transform: inherit; color: var(--text-dim); background: none; border: 0; padding: 8px 0; cursor: pointer;
    transition: color var(--dur-1) ease; }
  .alts button:hover { color: var(--text); }
  .alts button::after { content: ' ↗'; }

  /* "Daftar": same card, body becomes a list of every destination */
  .list { display: none; margin: 0; padding: 0; list-style: none; border-top: 1px solid var(--border); }
  #banner.is-list { width: min(400px, calc(100vw - 36px)); }
  #banner.is-list .list { display: block; }
  #banner.is-list #bannerDesc, #banner.is-list .btn, #banner.is-list .alts { display: none; }
  #banner.is-list .banner-more { margin-top: 14px; }
  #banner.is-list .badge::before { display: none; }
  .list .row { display: flex; align-items: center; gap: 12px; padding: 10px 6px; border-bottom: 1px solid var(--border); border-radius: 10px;
    transition: background var(--dur-1) ease; }
  .list li:last-child .row { border-bottom: 0; }
  .list a:hover { background: rgba(255, 255, 255, .03); }
  .row-icon { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; flex: none;
    border: 1px solid var(--border); background: #0c0c0c; }
  .row-text { flex: 1; min-width: 0; display: grid; gap: 2px; }
  .row-text strong { font: 500 15px/1.25 var(--font-display); letter-spacing: -.02em; }
  .row-text span { color: var(--text-dim); font-size: 12.5px; line-height: 1.45; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row.is-soon .row-icon, .row.is-soon .row-text { opacity: .5; }
  #banner .list .badge { display: inline-block; flex: none; }
  .badge.is-soon::before { display: none; }
  .btn.is-disabled { background: transparent; color: var(--text-faint); border: 1px dashed var(--border-strong); cursor: default; pointer-events: none; }
  .row-arrow { color: var(--text-faint); transition: color var(--dur-1) ease, transform var(--dur-1) var(--ease); }
  .list a:hover .row-arrow { color: var(--text); transform: translateX(2px); }
  /* Phones: the list must fit between the header and the mascot's head, so rows drop their description. */
  @media (max-width: 560px) {
    #banner.is-list:not(.is-compact) { padding: 14px; }
    #banner.is-list .banner-head h2 { font-size: 18px; }
    #banner.is-list .banner-icon { width: 40px; height: 40px; border-radius: 12px; }
    #banner.is-list .banner-more { margin-top: 10px; }
    .list .row { padding: 6px 4px; }
    .row-icon { width: 28px; height: 28px; border-radius: 9px; }
    .row-text span { display: none; }
  }
</style>
</head>
<body>
<main class="scene" id="scene">
  <canvas id="room" aria-hidden="true"></canvas>

  <header class="chrome chrome--top">
    <span class="code">SVN / Reception</span>
    <a class="brand" href="./" aria-label="Sevnsoul"><img src="brand-mark.png" alt="" width="26" height="26"><span>SEVNSOUL</span></a>
    <div class="tools">
      <a href="lab.html" title="Lab animasi &amp; ikon"><span data-icon="grid" data-size="24"></span><span class="sr-only">Lab</span></a>
      <button id="motionToggle" type="button" aria-pressed="false"><span data-icon="pause" data-size="24"></span><span class="sr-only">Kurangi gerak</span></button>
    </div>
  </header>

  <div id="say" class="float" aria-hidden="true"><span id="sayText"></span></div>
  <p id="sayLive" class="sr-only" aria-live="polite"></p>

  <div id="orbit" role="group" aria-label="Saran pencarian"></div>

  <div class="hang">
  <div id="cord" class="cord float" aria-hidden="true"></div>
  <article id="banner" class="float is-compact" hidden aria-labelledby="bannerTitle">
    <div class="banner-head"><span class="banner-icon" id="bannerIcon"></span><h2 id="bannerTitle"></h2><span class="badge" id="bannerBadge" hidden></span></div>
    <div class="banner-more">
      <p id="bannerDesc"></p>
      <a id="bannerCta" class="btn" href="#"></a>
      <div id="bannerAlts" class="alts"></div>
      <ul id="bannerList" class="list" aria-label="Semua tujuan"></ul>
    </div>
  </article>
  </div>

  <form id="searchForm" class="float" role="search" autocomplete="off">
    <label for="q" class="sr-only">Apa yang kamu cari di sini?</label>
    <div class="field">
      <span data-icon="search" data-size="24"></span>
      <input id="q" name="q" type="search" enterkeyhint="search" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Ketik, lalu tekan Enter">
      <button type="submit" aria-label="Cari"><span data-icon="arrowRight" data-size="24"></span></button>
    </div>
  </form>

  <footer class="chrome chrome--bottom">
    <span>Sevnsoul · <span id="year"></span></span>
    <span></span>
    <span>Ideas, Built.</span>
  </footer>
</main>

<script src="sprite.js"></script>
<script src="icons.js"></script>
<script src="content.js"></script>
<script src="landing.js"></script>
</body>
</html>
