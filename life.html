<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sevnsoul — Ideas, Built</title>
<meta name="description" content="Sevnsoul — a personal collective of tools, systems and ideas across Financial, Life, Business, Learning, Utilities, AI and Media.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root{
    --bg: #0a0a0a;
    --bg-soft: #0d0d0d;
    --surface: #161616;
    --surface-2: #1e1e1e;
    --surface-3: #262626;
    --border: rgba(255,255,255,0.07);
    --border-strong: rgba(255,255,255,0.14);
    --text: #f4f4f2;
    --text-dim: rgba(244,244,242,0.58);
    --text-faint: rgba(244,244,242,0.34);
    --shadow-dark: rgba(0,0,0,0.55);
    --shadow-light: rgba(255,255,255,0.035);
    --radius: 20px;
    --ease: cubic-bezier(.22,1,.36,1);
    --max: 1180px;
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  html{scroll-behavior:smooth;}

  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    min-height: 100vh;
    position: relative;
  }

  /* ambient texture: faint radial glow + grain-like noise via layered gradients */
  body::before{
    content:"";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 900px 600px at 50% -10%, rgba(255,255,255,0.05), transparent 60%),
      radial-gradient(ellipse 700px 500px at 90% 80%, rgba(255,255,255,0.025), transparent 60%),
      radial-gradient(ellipse 700px 500px at 5% 60%, rgba(255,255,255,0.02), transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  ::selection{ background: var(--text); color: var(--bg); }

  a{ color: inherit; text-decoration: none; }

  :focus-visible{
    outline: 1px solid var(--text);
    outline-offset: 4px;
    border-radius: 4px;
  }

  .wrap{
    position: relative;
    z-index: 1;
    max-width: var(--max);
    margin: 0 auto;
    padding: 0 24px;
  }

  /* ---------- HEADER ---------- */

  header{
    padding: 64px 0 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .logo-mark{
    width: 84px;
    height: auto;
    filter: drop-shadow(0 8px 24px rgba(255,255,255,0.06));
    animation: rise 900ms var(--ease) both;
  }

  .wordmark{
    margin-top: 18px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.42em;
    color: var(--text-dim);
    animation: rise 900ms var(--ease) 80ms both;
  }

  @keyframes rise{
    from{ opacity: 0; transform: translateY(14px); }
    to{ opacity: 1; transform: translateY(0); }
  }

  /* ---------- HERO ---------- */

  .hero{
    padding: 56px 0 72px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .hero h1{
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 400;
    font-size: clamp(28px, 4.6vw, 50px);
    line-height: 1.28;
    letter-spacing: -0.01em;
    max-width: 820px;
    color: var(--text);
    animation: rise 900ms var(--ease) 160ms both;
  }

  .hero h1 em{
    font-style: normal;
    font-weight: 600;
    color: #ffffff;
  }

  .hero p.sub{
    margin-top: 22px;
    max-width: 560px;
    font-size: 15px;
    line-height: 1.7;
    color: var(--text-dim);
    font-weight: 300;
    animation: rise 900ms var(--ease) 240ms both;
  }

  /* ---------- CATEGORY GRID ---------- */

  .categories{
    padding-bottom: 120px;
  }

  .cat-grid{
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
  }

  .cat-card{
    position: relative;
    grid-column: span 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 28px;
    min-height: 176px;
    padding: 26px 26px 22px;
    border-radius: var(--radius);
    background: linear-gradient(155deg, var(--surface) 0%, var(--surface-2) 100%);
    border: 1px solid var(--border);
    box-shadow:
      8px 8px 20px var(--shadow-dark),
      -6px -6px 16px var(--shadow-light);
    cursor: pointer;
    overflow: hidden;
    transition: transform 420ms var(--ease), border-color 420ms var(--ease), box-shadow 420ms var(--ease);
    animation: rise 700ms var(--ease) both;
  }

  .cat-card::before{
    /* glass sheen layer, revealed on hover */
    content:"";
    position: absolute;
    inset: 0;
    background: linear-gradient(120deg, rgba(255,255,255,0.10), rgba(255,255,255,0.015) 40%, transparent 70%);
    backdrop-filter: blur(6px);
    opacity: 0;
    transition: opacity 420ms var(--ease);
    pointer-events: none;
  }

  .cat-card:hover,
  .cat-card:focus-visible{
    transform: translateY(-4px);
    border-color: var(--border-strong);
    box-shadow:
      10px 10px 26px var(--shadow-dark),
      -8px -8px 20px var(--shadow-light),
      0 0 0 1px rgba(255,255,255,0.03) inset;
  }

  .cat-card:hover::before,
  .cat-card:focus-visible::before{
    opacity: 1;
  }

  .cat-card:active{
    transform: translateY(-1px) scale(0.995);
  }

  .cat-top{
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    position: relative;
    z-index: 1;
  }

  .cat-icon{
    width: 34px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text);
    opacity: 0.9;
  }
  .cat-icon svg{ width: 100%; height: 100%; }

  .cat-arrow{
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 1px solid var(--border-strong);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 420ms var(--ease), background 420ms var(--ease);
  }
  .cat-arrow svg{ width: 13px; height: 13px; transition: transform 420ms var(--ease); }

  .cat-card:hover .cat-arrow{
    background: var(--text);
  }
  .cat-card:hover .cat-arrow svg{
    transform: translate(1px,-1px);
  }
  .cat-card:hover .cat-arrow svg path,
  .cat-card:hover .cat-arrow svg line{
    stroke: var(--bg);
  }

  .cat-body{ position: relative; z-index: 1; }

  .cat-name{
    font-family: 'Space Grotesk', sans-serif;
    font-size: 19px;
    font-weight: 500;
    letter-spacing: -0.01em;
    margin-bottom: 8px;
  }

  .cat-focus{
    font-size: 12.5px;
    line-height: 1.55;
    color: var(--text-faint);
    font-weight: 400;
    max-width: 34ch;
  }

  /* featured card (7th / AI) spans full width */
  .cat-card.featured{
    grid-column: 1 / -1;
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    min-height: auto;
    padding: 30px 34px;
    background: linear-gradient(120deg, var(--surface-2) 0%, var(--surface) 60%, var(--surface-3) 100%);
  }
  .cat-card.featured .cat-top{ display: contents; }
  .cat-card.featured .cat-icon{ width: 40px; height: 40px; flex-shrink: 0; margin-right: 24px; }
  .cat-card.featured .cat-body{ flex: 1; }
  .cat-card.featured .cat-focus{ max-width: 56ch; }
  .cat-card.featured .cat-arrow{ flex-shrink: 0; margin-left: 24px; }

  /* ---------- FOOTER ---------- */

  footer{
    padding: 36px 0 56px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    border-top: 1px solid var(--border);
  }

  .footer-mark{
    width: 22px;
    opacity: 0.5;
  }

  footer p{
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--text-faint);
  }

  /* ---------- RESPONSIVE ---------- */

  @media (max-width: 860px){
    .cat-grid{ grid-template-columns: repeat(2, 1fr); }
  }

  @media (max-width: 560px){
    header{ padding: 48px 0 4px; }
    .hero{ padding: 40px 0 56px; }
    .cat-grid{ grid-template-columns: 1fr; gap: 14px; }
    .cat-card.featured{ flex-direction: column; align-items: flex-start; gap: 20px; }
    .cat-card.featured .cat-icon{ margin-right: 0; }
    .cat-card.featured .cat-arrow{ margin-left: 0; align-self: flex-end; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation: none !important; transition: none !important; }
  }
</style>
<style>
  /* ---------- HERO NAV ---------- */
  .hero-nav {
    margin-bottom: 24px;
    font-size: 13px;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    animation: rise 900ms var(--ease) both;
  }
  .hero-nav a {
    color: var(--text);
    transition: color 200ms ease;
  }
  .hero-nav a:hover {
    color: #fff;
  }
  .hero-nav span {
    opacity: 0.5;
  }

  /* ---------- PRODUCT GRID ---------- */
  .product-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
  }
  .product-card {
    position: relative;
    grid-column: span 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 20px;
    padding: 26px;
    border-radius: var(--radius);
    background: linear-gradient(155deg, var(--surface) 0%, var(--surface-2) 100%);
    border: 1px solid var(--border);
    box-shadow: 8px 8px 20px var(--shadow-dark), -6px -6px 16px var(--shadow-light);
    cursor: pointer;
    overflow: hidden;
    transition: transform 420ms var(--ease), border-color 420ms var(--ease), box-shadow 420ms var(--ease);
    animation: rise 700ms var(--ease) both;
    text-decoration: none;
  }
  .product-card::before {
    content:"";
    position: absolute;
    inset: 0;
    background: linear-gradient(120deg, rgba(255,255,255,0.10), rgba(255,255,255,0.015) 40%, transparent 70%);
    backdrop-filter: blur(6px);
    opacity: 0;
    transition: opacity 420ms var(--ease);
    pointer-events: none;
  }
  .product-card:hover {
    transform: translateY(-4px);
    border-color: var(--border-strong);
    box-shadow: 10px 10px 26px var(--shadow-dark), -8px -8px 20px var(--shadow-light), 0 0 0 1px rgba(255,255,255,0.03) inset;
  }
  .product-card:hover::before { opacity: 1; }
  .product-card:active { transform: translateY(-1px) scale(0.995); }

  .prod-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    position: relative;
    z-index: 1;
  }
  .prod-icon {
    width: 34px; height: 34px;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px;
    opacity: 0.9;
  }
  .status-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 600;
    padding: 4px 8px;
    border-radius: 12px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .status-badge.active { background: rgba(74, 222, 128, 0.15); color: #4ade80; }
  .status-badge.coming-soon { background: rgba(250, 204, 21, 0.15); color: #facc15; }
  .status-badge.beta { background: rgba(96, 165, 250, 0.15); color: #60a5fa; }

  .prod-body { position: relative; z-index: 1; margin-top: auto; }
  .prod-name {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 18px; font-weight: 500;
    letter-spacing: -0.01em; margin-bottom: 8px; color: var(--text);
  }
  .prod-desc {
    font-size: 13px; line-height: 1.5; color: var(--text-faint); font-weight: 400;
  }

  @media (max-width: 860px){
    .product-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 560px){
    .product-grid { grid-template-columns: 1fr; gap: 14px; }
  }
</style>
</head>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  const products = [];

  const grid = document.getElementById('product-grid');

  if (products.length === 0) {
    grid.innerHTML = '<p style="color: var(--text-dim); text-align: center; grid-column: 1 / -1; font-size: 14px;">No products in this category yet. Stay tuned!</p>';
  } else {
    products.forEach((prod, i) => {
      const card = document.createElement('a');
      card.href = prod.link;
      card.target = prod.link.startsWith('http') ? '_blank' : '_self';
      card.className = 'product-card';
      card.style.animationDelay = (300 + i * 60) + 'ms';
      card.setAttribute('aria-label', prod.name + ' â€” ' + prod.description);

      const statusClass = prod.status.toLowerCase().replace(' ', '-');

            card.innerHTML = `
        <div class="prod-top">
          <div class="prod-icon">${prod.icon}</div>
          <div class="status-badge ${statusClass}">${prod.status}</div>
        </div>
        <div class="prod-body">
          <div class="prod-name">${prod.name}</div>
          <div class="prod-desc">${prod.description}</div>
        </div>
      `;
      grid.appendChild(card);
    });
  }
</script>

<script>
  // Mobile back button logic: if arrived from outside, force back button to go to home page
  if (!document.referrer || !document.referrer.includes(window.location.hostname)) {
    window.history.pushState({ intercept: true }, "", window.location.href);
    window.addEventListener("popstate", function () {
      window.location.href = "index.html";
    });
  }
</script>
